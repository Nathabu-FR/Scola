name: Build Scola (Tauri)

on:
  workflow_dispatch: {}
  push:
    branches: [dev]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Restore Node dependency tree
        id: node-modules-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: node_modules
          key: windows-node24-${{ hashFiles('package.json', 'patches/**') }}
          restore-keys: windows-node24-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install app dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --legacy-peer-deps

      - name: Save Node dependency tree
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: node_modules
          key: windows-node24-${{ hashFiles('package.json', 'patches/**') }}

      - name: Restore Expo Metro transform cache
        id: metro-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/expo-metro-restore
          key: windows-metro-${{ hashFiles('package.json', 'app.config.ts', 'babel.config.js', 'metro.config.js', 'patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: windows-metro-${{ hashFiles('package.json', 'app.config.ts', 'babel.config.js', 'metro.config.js', 'patches/**') }}-

      - name: Prepare Metro cache directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\expo-metro-restore" | Out-Null
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\expo-metro-output" | Out-Null

      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release tag: $env:RELEASE_TAG" }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.version = $version
          $package | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding utf8
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauri.version = $version
          $tauri | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^version = "[^"]+"', "version = `"$version`"", 1)
          Set-Content src-tauri/Cargo.toml $cargo -Encoding utf8

      - name: Export web bundle
        id: export-web
        run: npx expo export --platform web
        env:
          SCOLA_TARGET: desktop
          EXPO_METRO_CACHE_RESTORE_DIR: ${{ runner.temp }}\expo-metro-restore
          EXPO_METRO_CACHE_OUTPUT_DIR: ${{ runner.temp }}\expo-metro-output

      - name: Save Expo Metro transform cache
        if: steps.export-web.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/expo-metro-output
          key: windows-metro-${{ hashFiles('package.json', 'app.config.ts', 'babel.config.js', 'metro.config.js', 'patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check source for unsafe web ExpoUI imports
        run: npm run check:web-native-imports

      - name: Check Web animations for unsupported springify usage
        run: npm run check:web-animations

      - name: Check Web/Tauri compatibility
        run: npm run check:web-compat

      - name: Check exported web bundle for ExpoUI native module
        run: node scripts/check-web-bundle.js

      - name: Build Scola for GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Scola
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Scola-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
