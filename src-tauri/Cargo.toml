[package]
name = "scola"
version = "8.5.4"
description = "Scola — l’application scolaire sur ordinateur"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-http = { version = "2.6", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
sha2 = "0.10"

[[bin]]
name = "scola"
path = "src/main.rs"
